[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lanternport"
version = "0.1.0"
description = "World engine for Lanternport: simulates the city, its news and markets, and publishes the site's data"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["lanternport*"]

[tool.setuptools.package-data]
lanternport = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
