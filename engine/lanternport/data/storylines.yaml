# Storylines: the news engine of Lanternport.
#
# scope:    company (about one company), sector, market (everyone) or weather.
# weight:   how often it's picked relative to others of the same scope.
# requires: optional - has: [rival|supplier|customer], sectors: [...], months: [...]
# stages:   at   = trading days after the storyline starts (a number, or [lo, hi])
#           kind = which lesson the end-of-round recap shows (see lessons)
#           importance = 1-3, how prominently the Ledger runs it
#           headlines / bodies = picked at random; {placeholders} are filled in
#           effects = how prices react. For each target:
#             gap   = overnight move at the next open (log return range); a reacting player can't catch it
#             drift = extra move spread over the following `days`; a reacting player can catch it
#             fade  = instead of drift, take back this fraction of the gap (rumours, overreactions)
#             fail  = chance the drift doesn't happen
#           branches = alternative versions of a stage with probabilities p (e.g. deal agreed or talks collapse)
# targets:  company, rival, supplier, customer, bidder, sector (the storyline's sector), market,
#           weather:hot / weather:cold / weather:rain (companies sensitive to that weather), company:<id>
#
# Placeholders: {company} {company_s} (possessive) {boss} {trait} {product} {what} {district} {rival} {supplier} {customer}
#   {bidder} {sector} {newboss} {mayor} {governor} {weather} {gossip} {union} {editor}

lessons:
  results_good: Good results tend to keep lifting the price for several days.
  results_bad: Bad results tend to keep weighing on the price for several days.
  analyst_up: Analyst upgrades give a small, short-lived boost.
  analyst_down: Analyst downgrades give a small, short-lived drop.
  contract: Big contract wins tend to add steady gains.
  ceo_exit: Surprise departures at the top tend to drag on the price.
  new_boss: A well-received new boss can steady the ship.
  shock: Disasters cause a sharp drop, and the damage often keeps coming for a few days.
  recovery: Good news after a disaster tends to lift the price back up.
  rumour: Takeover rumours spike the price, then usually fade.
  deal: A confirmed takeover lifts the price, and it tends to keep rising towards the offer.
  no_deal: When takeover talks collapse, the price tends to keep sliding.
  hype: A teaser builds a little excitement before a launch.
  hit: Rave reviews tend to keep a share rising.
  flop: A flop tends to keep dragging on the price.
  fad: Viral crazes spike the price, then fade as the fuss dies down.
  scandal: Scandals cause a sharp drop that often partly recovers.
  cleared: Being cleared after a scandal lifts the price.
  fined: A fine at the end of a scandal is a smaller, final knock.
  strike: Strikes weigh on a company until they're settled.
  strike_over: Settling a strike brings relief to the price.
  supply: A supplier's troubles hurt the companies that depend on it.
  rates_up: Higher interest rates tend to drag the whole market down for a while.
  rates_down: Lower interest rates tend to lift the whole market for a while.
  rates_hint: Hints about interest rates move the market a little before the decision.
  mood_good: Good news for the whole market lifts most shares for a while.
  mood_bad: Bad news for the whole market drags most shares down for a while.
  heat: Heatwaves help sunny-weather businesses and hurt cold-weather ones.
  cold: Cold snaps help heating and cosy businesses and hurt sunny ones.
  storm: Storms hurt travel and insurers and help rainy-day businesses.
  festival: The Lantern Festival brings crowds to seaside, food and travel businesses.
  sector_up: Excitement about a whole sector lifts its companies for a while.
  sector_down: Gloom about a whole sector drags its companies down for a while.
  fluff: Not every headline matters.

storylines:
  # --- Company news -----------------------------------------------------------------
  - id: results_good
    scope: company
    weight: 1.0
    stages:
      - at: 0
        kind: results_good
        importance: 2
        headlines:
          - "{company} beats profit forecasts and raises its outlook"
          - "{company} reports record sales of {product}"
          - "Bumper quarter for {company} as profits jump"
        bodies:
          - "{boss}, who {trait}, called the results 'the best in our history'."
        effects:
          - { target: company, gap: [0.01, 0.035], drift: [0.04, 0.09], days: [4, 7], fail: 0.15 }

  - id: results_bad
    scope: company
    weight: 1.0
    stages:
      - at: 0
        kind: results_bad
        importance: 2
        headlines:
          - "{company} misses profit forecasts as costs rise"
          - "{company} warns sales of {product} are falling short"
          - "Gloomy quarter for {company}"
        bodies:
          - "{boss} admitted it had been 'a bumpy few months' and promised a plan."
        effects:
          - { target: company, gap: [-0.045, -0.015], drift: [-0.09, -0.04], days: [4, 7], fail: 0.15 }

  - id: analyst_up
    scope: company
    weight: 0.8
    stages:
      - at: 0
        kind: analyst_up
        importance: 1
        headlines: ["Analysts upgrade {company} to 'buy'", "Big bank raises its price target for {company}"]
        effects:
          - { target: company, gap: [0.005, 0.015], drift: [0.015, 0.04], days: [2, 4], fail: 0.25 }

  - id: analyst_down
    scope: company
    weight: 0.8
    stages:
      - at: 0
        kind: analyst_down
        importance: 1
        headlines: ["Analysts cut {company} to 'sell'", "Broker downgrades {company}, citing slowing growth"]
        effects:
          - { target: company, gap: [-0.015, -0.005], drift: [-0.04, -0.015], days: [2, 4], fail: 0.25 }

  - id: contract
    scope: company
    weight: 0.8
    stages:
      - at: 0
        kind: contract
        importance: 2
        headlines: ["{company} wins its biggest-ever contract", "{company} signs a major deal to sell {product} nationwide"]
        effects:
          - { target: company, gap: [0.015, 0.04], drift: [0.025, 0.06], days: [3, 6], fail: 0.2 }

  - id: ceo_exit
    scope: company
    weight: 0.4
    stages:
      - at: 0
        kind: ceo_exit
        importance: 2
        headlines: ["{company} boss {boss} steps down unexpectedly", "{boss} quits {company} after boardroom row"]
        bodies: ["{gossip} reports raised voices and a thrown croissant."]
        effects:
          - { target: company, gap: [-0.06, -0.02], drift: [-0.07, -0.025], days: [5, 8], fail: 0.2 }
      - at: [6, 9]
        kind: new_boss
        importance: 1
        headlines: ["{company} names {newboss} as new chief executive", "{newboss} takes the helm at {company}"]
        effects:
          - { target: company, gap: [0.0, 0.015], drift: [0.01, 0.035], days: [3, 5], fail: 0.35 }

  - id: factory_fire
    scope: company
    weight: 0.3
    requires: { sectors: [industrials, food, consumer, energy] }
    stages:
      - at: 0
        kind: shock
        importance: 3
        headlines: ["Fire breaks out at {company} site in {district}", "Blaze halts production at {company}"]
        bodies: ["Nobody was hurt, but production of {product} has stopped. Firefighters were there all night."]
        effects:
          - { target: company, gap: [-0.08, -0.04], drift: [-0.05, -0.015], days: [3, 6], fail: 0.2 }
          - { target: rival, gap: [0.0, 0.01], drift: [0.01, 0.035], days: [4, 7], fail: 0.3 }
          - { target: customer, gap: [-0.01, 0.0], drift: [-0.025, -0.008], days: [3, 6], fail: 0.3 }
      - at: [6, 10]
        branches:
          - p: 0.65
            kind: recovery
            importance: 2
            headlines: ["{company} reopens after fire, ahead of schedule"]
            effects:
              - { target: company, gap: [0.01, 0.03], drift: [0.03, 0.06], days: [4, 7], fail: 0.2 }
          - p: 0.35
            kind: shock
            importance: 2
            headlines: ["Insurers refuse to pay out on {company} fire"]
            effects:
              - { target: company, gap: [-0.03, -0.01], drift: [-0.04, -0.015], days: [3, 6], fail: 0.25 }

  - id: takeover
    scope: company
    weight: 0.35
    stages:
      - at: 0
        kind: rumour
        importance: 3
        headlines: ["Reports: {bidder} eyes takeover of {company}", "Rumours swirl of a bid for {company}"]
        bodies: ["Neither company would comment. {gossip} says lawyers were seen at Golden Fork until midnight."]
        effects:
          - { target: company, gap: [0.06, 0.12], fade: [0.5, 0.9], days: [4, 7], fail: 0.15 }
      - at: [5, 8]
        branches:
          - p: 0.35
            kind: deal
            importance: 3
            headlines: ["{bidder} agrees to buy {company}", "It's official: {company} accepts takeover offer"]
            effects:
              - { target: company, gap: [0.03, 0.07], drift: [0.02, 0.05], days: [4, 7], fail: 0.15 }
              - { target: bidder, gap: [-0.03, -0.01], drift: [-0.03, -0.01], days: [3, 5], fail: 0.3 }
          - p: 0.65
            kind: no_deal
            importance: 2
            headlines: ["{company} takeover talks collapse", "{bidder} walks away from {company} bid"]
            effects:
              - { target: company, gap: [-0.05, -0.02], drift: [-0.05, -0.02], days: [3, 6], fail: 0.2 }

  - id: product_launch
    scope: company
    weight: 0.5
    stages:
      - at: 0
        kind: hype
        importance: 1
        headlines: ["{company} teases a mystery new product for next week", "{boss} promises 'something big' from {company}"]
        effects:
          - { target: company, gap: [0.0, 0.01], drift: [0.01, 0.03], days: [3, 5], fail: 0.3 }
      - at: [5, 7]
        branches:
          - p: 0.55
            kind: hit
            importance: 2
            headlines: ["Rave reviews for new {product} from {company}", "Queues round the block for {company_s} {product}"]
            effects:
              - { target: company, gap: [0.015, 0.04], drift: [0.03, 0.07], days: [4, 7], fail: 0.2 }
          - p: 0.45
            kind: flop
            importance: 2
            headlines: ["Critics pan new {product} from {company}", "Early buyers call {company_s} {product} a damp squib"]
            effects:
              - { target: company, gap: [-0.04, -0.015], drift: [-0.06, -0.02], days: [4, 7], fail: 0.2 }

  - id: viral
    scope: company
    weight: 0.3
    requires: { sectors: [consumer, food, retail, tech, media] }
    stages:
      - at: 0
        kind: fad
        importance: 3
        headlines: ["{company_s} {product} goes viral as Lanternport goes wild for it", "Everyone wants one: {company_s} {product} sells out in hours"]
        bodies: ["Videos of people queuing for {product} have been watched millions of times."]
        effects:
          - { target: company, gap: [0.05, 0.11], fade: [0.5, 0.9], days: [6, 9], fail: 0.15 }
      - at: [7, 10]
        kind: fad
        importance: 1
        headlines: ["The {product} craze cools, {company} admits", "Shops left with piles of unsold {product} from {company}"]
        effects: []

  - id: scandal
    scope: company
    weight: 0.35
    stages:
      - at: 0
        kind: scandal
        importance: 3
        headlines:
          - "{company} recalls {product} after custard explosion"
          - "{company} hit by accounting investigation"
          - "Regulator fines {company} over safety failings"
        bodies: ["{boss} said the company was 'deeply embarrassed' and 'cooperating fully'."]
        effects:
          - { target: company, gap: [-0.12, -0.06], fade: [0.35, 0.65], days: [6, 10], fail: 0.25 }
      - at: [8, 12]
        branches:
          - p: 0.6
            kind: cleared
            importance: 2
            headlines: ["{company} cleared after investigation", "Inquiry finds no wrongdoing at {company}"]
            effects:
              - { target: company, gap: [0.01, 0.03], drift: [0.015, 0.04], days: [3, 5], fail: 0.25 }
          - p: 0.4
            kind: fined
            importance: 1
            headlines: ["{company} fined after investigation, ending the affair"]
            effects:
              - { target: company, gap: [-0.025, -0.008], drift: [-0.02, 0.0], days: [2, 4], fail: 0.4 }

  - id: strike
    scope: company
    weight: 0.3
    requires: { sectors: [industrials, travel, retail, food, energy] }
    stages:
      - at: 0
        kind: strike
        importance: 2
        headlines: ["Workers walk out at {company}", "{union} calls strike at {company}"]
        bodies: ["Pickets gathered in {district} say they want 'fair pay and better biscuits'."]
        effects:
          - { target: company, gap: [-0.03, -0.01], drift: [-0.05, -0.02], days: [4, 7], fail: 0.2 }
      - at: [5, 9]
        kind: strike_over
        importance: 1
        headlines: ["{company} and {union} shake hands on a deal", "Strike at {company} ends"]
        effects:
          - { target: company, gap: [0.005, 0.02], drift: [0.015, 0.04], days: [3, 5], fail: 0.25 }

  - id: supply_problem
    scope: company
    weight: 0.3
    requires: { has: [supplier] }
    stages:
      - at: 0
        kind: supply
        importance: 1
        headlines: ["{supplier} delays hit {company}", "{company} warns of shortages as {supplier} struggles"]
        effects:
          - { target: company, gap: [-0.025, -0.008], drift: [-0.045, -0.015], days: [3, 6], fail: 0.2 }
          - { target: supplier, gap: [-0.02, -0.005], drift: [-0.03, -0.01], days: [3, 5], fail: 0.25 }

  - id: fluff
    scope: company
    weight: 1.6
    stages:
      - at: 0
        kind: fluff
        importance: 1
        headlines:
          - "{company} opens a new office in {district}"
          - "{company} sponsors the Lanternport Lions"
          - "{company} unveils a new logo"
          - "{company} hosts its annual staff awards"
          - "{company} launches a podcast"
          - "{boss}, who {trait}, named Lanternport Boss of the Month"
          - "{company} raises money for the lighthouse appeal"
        effects: []

  # --- Sector news ---------------------------------------------------------------------
  - id: sector_boom
    scope: sector
    weight: 1.0
    stages:
      - at: 0
        kind: sector_up
        importance: 2
        headlines: ["{sector} fever grips the Exchange", "Investors pile into {sector} shares"]
        effects:
          - { target: sector, gap: [0.0, 0.015], drift: [0.025, 0.055], days: [5, 8], fail: 0.2 }

  - id: sector_slump
    scope: sector
    weight: 1.0
    stages:
      - at: 0
        kind: sector_down
        importance: 2
        headlines: ["{sector} shares slump on growth fears", "Investors turn their backs on {sector}"]
        effects:
          - { target: sector, gap: [-0.015, 0.0], drift: [-0.055, -0.025], days: [5, 8], fail: 0.2 }

  # --- Market news ---------------------------------------------------------------------
  - id: rates
    scope: market
    weight: 1.0
    stages:
      - at: 0
        branches:
          - p: 0.5
            kind: rates_hint
            importance: 2
            headlines: ["{governor} hints interest rates may rise"]
            effects:
              - { target: market, gap: [-0.008, 0.0], drift: [-0.02, -0.005], days: [2, 4], fail: 0.3 }
            then: up
          - p: 0.5
            kind: rates_hint
            importance: 2
            headlines: ["{governor} hints interest rates could fall"]
            effects:
              - { target: market, gap: [0.0, 0.008], drift: [0.005, 0.02], days: [2, 4], fail: 0.3 }
            then: down
      - at: [3, 5]
        branches:
          - p: 0.85
            when: up
            kind: rates_up
            importance: 3
            headlines: ["Bank of Lanternport raises interest rates", "Rates up: {governor} acts to cool prices"]
            effects:
              - { target: market, gap: [-0.012, -0.003], drift: [-0.045, -0.02], days: [5, 8], fail: 0.2 }
          - p: 0.85
            when: down
            kind: rates_down
            importance: 3
            headlines: ["Bank of Lanternport cuts interest rates", "Rate cut cheers shoppers and the Exchange"]
            effects:
              - { target: market, gap: [0.003, 0.012], drift: [0.02, 0.045], days: [5, 8], fail: 0.2 }

  - id: market_mood_good
    scope: market
    weight: 1.0
    stages:
      - at: 0
        kind: mood_good
        importance: 2
        headlines: ["Lantern 60 hits a record high as inflation cools", "Shoppers splash out as confidence soars"]
        effects:
          - { target: market, gap: [0.0, 0.008], drift: [0.02, 0.045], days: [5, 8], fail: 0.2 }

  - id: market_mood_bad
    scope: market
    weight: 1.0
    stages:
      - at: 0
        kind: mood_bad
        importance: 2
        headlines: ["Recession fears grip the Exchange", "Shares slide as shoppers tighten their belts"]
        effects:
          - { target: market, gap: [-0.008, 0.0], drift: [-0.045, -0.02], days: [5, 8], fail: 0.2 }

  - id: festival
    scope: market
    weight: 0.4
    requires: { months: [9, 10] }
    stages:
      - at: 0
        kind: festival
        importance: 3
        headlines: ["Lantern Festival crowds expected to break records", "Thousands pour into Lanternport for the Lantern Festival"]
        bodies: ["{mayor} will light the giant lantern on the pier at dusk."]
        effects:
          - { target: sector:travel, gap: [0.0, 0.01], drift: [0.02, 0.05], days: [4, 7], fail: 0.2 }
          - { target: sector:food, gap: [0.0, 0.008], drift: [0.015, 0.04], days: [4, 7], fail: 0.2 }

  # --- Weather -------------------------------------------------------------------------
  - id: heatwave
    scope: weather
    weight: 1.0
    requires: { months: [6, 7, 8] }
    stages:
      - at: 0
        kind: heat
        importance: 3
        headlines: ["Heatwave hits Lanternport: 31C expected", "{weather} forecasts the hottest week in years"]
        bodies: ["Ice cream vans report queues down the promenade."]
        effects:
          - { target: weather:hot, gap: [0.005, 0.02], drift: [0.02, 0.05], days: [4, 7], fail: 0.2 }
          - { target: weather:cold, gap: [-0.015, -0.003], drift: [-0.04, -0.015], days: [4, 7], fail: 0.25 }
      - at: [6, 9]
        kind: fluff
        importance: 1
        headlines: ["Heatwave finally breaks with a crash of thunder"]
        effects: []

  - id: cold_snap
    scope: weather
    weight: 1.0
    requires: { months: [11, 12, 1, 2] }
    stages:
      - at: 0
        kind: cold
        importance: 3
        headlines: ["Big freeze: snow blankets Lanternport", "{weather} warns of the coldest week in a decade"]
        bodies: ["The harbour has frozen over for the first time since the custard winter of '89."]
        effects:
          - { target: weather:cold, gap: [0.005, 0.02], drift: [0.02, 0.05], days: [4, 7], fail: 0.2 }
          - { target: weather:hot, gap: [-0.015, -0.003], drift: [-0.04, -0.015], days: [4, 7], fail: 0.25 }

  - id: storm
    scope: weather
    weight: 1.0
    requires: { months: [10, 11, 12, 1, 2, 3] }
    stages:
      - at: 0
        kind: storm
        importance: 3
        headlines: ["Storm {storm} batters Lanternport", "Gales close the pier and ground flights at Gullswing"]
        effects:
          - { target: sector:travel, gap: [-0.02, -0.005], drift: [-0.04, -0.015], days: [3, 6], fail: 0.25 }
          - { target: company:copperpot, gap: [-0.03, -0.01], drift: [-0.03, -0.01], days: [3, 5], fail: 0.25 }
          - { target: weather:rain, gap: [0.0, 0.015], drift: [0.015, 0.04], days: [3, 6], fail: 0.25 }
