# Builds the world and the site, and publishes to GitHub Pages:
#   - on every push to main,
#   - every morning at 05:00 UTC (6am UK in summer, 5am in winter), which puts out the new Ledger,
#   - or by hand from the Actions tab.
#
# One-time setup:
#   - Settings > Pages > Source: "GitHub Actions"
#   - Settings > Secrets and variables > Actions > New repository secret: LANTERNPORT_SEED
#     (the number in engine/.seed on the developer's PC; it decides the whole world, so keep it secret)
# Ads (optional): repository variables ADSENSE_CLIENT (ca-pub-...), AD_SLOT_RESULT, AD_SLOT_FOOTER.
# Leaderboards: the API address defaults to the deployed worker below; set the repository variable
# API_URL to override it (e.g. after moving the API to a custom domain).
#
# Note: GitHub pauses scheduled workflows in public repos after 60 days without commits. It emails a
# warning first; any commit (or re-enabling the workflow in the Actions tab) restarts it.
name: Build and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Install the world engine
        run: pip install -e "engine[dev]"
      - name: Test the world engine
        working-directory: engine
        run: python -m pytest -q
      - name: Build today's world
        env:
          LANTERNPORT_SEED: ${{ secrets.LANTERNPORT_SEED }}
        run: |
          if [ -z "$LANTERNPORT_SEED" ]; then
            echo "::error::Add the LANTERNPORT_SEED repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          python -m lanternport build --through "$(TZ=Europe/London date +%F)"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Test the API
        working-directory: worker
        run: |
          npm ci
          npx vitest run
      - run: npm run build
        env:
          VITE_ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          VITE_AD_SLOT_RESULT: ${{ vars.AD_SLOT_RESULT }}
          VITE_AD_SLOT_FOOTER: ${{ vars.AD_SLOT_FOOTER }}
          VITE_API_URL: ${{ vars.API_URL || 'https://lanternport-api.lanternport-api.workers.dev' }}
      - name: Write ads.txt
        if: ${{ vars.ADSENSE_CLIENT != '' }}
        env:
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
        run: echo "google.com, ${ADSENSE_CLIENT#ca-}, DIRECT, f08c47fec0942fa0" > dist/ads.txt

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
